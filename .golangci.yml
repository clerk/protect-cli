# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/
#
# The standard linter set, which is what this code is held to where it is
# developed. The security scan runs separately (gosec, govulncheck), in CI.
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: standard

formatters:
  enable:
    - gofmt
