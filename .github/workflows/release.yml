name: Release

# Tag a commit on main as v1.2.3 and push the tag. This builds every platform,
# checks each binary, signs and notarizes the macOS packages, publishes the
# release with checksums, and points the Homebrew cask and formula at it.
#
# To test the build and signing without releasing anything, run this workflow
# by hand on main with skip_release left on.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v0.1.1-test)'
        required: true
        default: 'v0.0.0-test'
      skip_release:
        description: 'Skip creating GitHub release (just test build/sign)'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write  # the Homebrew update arrives as a pull request

jobs:
  build:
    name: Linux and Windows binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The list of strings that must never appear in a released binary is not
      # in this repository. Where the secret exists the build is scanned
      # against it; where it does not, `make binary` says on its own result
      # line that the term scan did not run, rather than printing a clean scan.
      - name: Take the forbidden-term list, if this repository has one
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          if [ -n "$FORBIDDEN_TERMS" ]; then
            printf '%s\n' "$FORBIDDEN_TERMS" > forbidden-terms.txt
            echo "scanning against $(grep -cve '^#' -e '^$' forbidden-terms.txt) terms"
          else
            echo "no FORBIDDEN_TERMS secret: the term scan will not run"
          fi

      # `make binary` builds the release way (-trimpath, no VCS stamp, no debug
      # information) and runs the release guard on what it built.
      - name: Build release binaries
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist

          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              make binary BIN=dist/clerk-protect VERSION="$VERSION"
            tar -czf "dist/clerk-protect-${VERSION}-linux-${arch}.tar.gz" -C dist clerk-protect -C .. README.md LICENSE
            rm dist/clerk-protect
          done

          for arch in amd64 arm64; do
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 \
              make binary BIN=dist/clerk-protect.exe VERSION="$VERSION"
            (cd dist && zip -q "clerk-protect-${VERSION}-windows-${arch}.zip" clerk-protect.exe ../README.md ../LICENSE)
            rm dist/clerk-protect.exe
          done

      - name: Forget the list
        if: always()
        run: rm -f forbidden-terms.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 1

  # macOS is built here, not in the Linux job: the Secure Enclave support is a
  # Swift shim, which has to be compiled on a Mac for the architecture the Go
  # build links. One runner builds both architectures; macOS 13 is the floor,
  # below which the link wants Swift's back-deployment library.
  sign-macos:
    name: macOS package (${{ matrix.arch }})
    runs-on: macos-latest
    environment: release
    strategy:
      matrix:
        include:
          - arch: arm64
            swift_target: arm64-apple-macos13
            cc: clang -arch arm64
          - arch: amd64
            swift_target: x86_64-apple-macos13
            cc: clang -arch x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Take the forbidden-term list, if this repository has one
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          if [ -n "$FORBIDDEN_TERMS" ]; then
            printf '%s\n' "$FORBIDDEN_TERMS" > forbidden-terms.txt
            echo "scanning against $(grep -cve '^#' -e '^$' forbidden-terms.txt) terms"
          else
            echo "no FORBIDDEN_TERMS secret: the term scan will not run"
          fi

      # CGO_ENABLED=1 explicitly: Go turns cgo off by default when GOARCH is not
      # the runner's own, and the Secure Enclave shim is linked through cgo.
      - name: Build the binary
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          mkdir -p dist
          make binary BIN="dist/clerk-protect-${VERSION}-darwin-${GOARCH}" VERSION="$VERSION" \
            SWIFT_TARGET="${{ matrix.swift_target }}"

      - name: Forget the list
        if: always()
        run: rm -f forbidden-terms.txt

      - name: Import certificates
        env:
          APPLE_DEVELOPER_ID_APPLICATION_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12 }}
          APPLE_DEVELOPER_ID_INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12 }}
          # Password can be empty if certs were exported without one
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Developer ID Application certificate (empty password is valid)
          APP_CERT_PATH="$RUNNER_TEMP/app_cert.p12"
          echo "$APPLE_DEVELOPER_ID_APPLICATION_P12" | base64 --decode > "$APP_CERT_PATH"
          security import "$APP_CERT_PATH" \
            -P "${APPLE_CERTIFICATE_PASSWORD:-}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" > /dev/null 2>&1

          # Import Developer ID Installer certificate (empty password is valid)
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer_cert.p12"
          echo "$APPLE_DEVELOPER_ID_INSTALLER_P12" | base64 --decode > "$INSTALLER_CERT_PATH"
          security import "$INSTALLER_CERT_PATH" \
            -P "${APPLE_CERTIFICATE_PASSWORD:-}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" > /dev/null 2>&1

          # Set keychain for code signing (suppress output)
          security list-keychain -d user -s "$KEYCHAIN_PATH" > /dev/null 2>&1
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null 2>&1

          # Clean up cert files
          rm -f "$APP_CERT_PATH" "$INSTALLER_CERT_PATH"

      - name: Build signed .pkg
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_IDENTITY: "Developer ID Application: ${{ vars.APPLE_DEVELOPER_NAME }} (${{ vars.APPLE_TEAM_ID }})"
          INSTALLER_IDENTITY: "Developer ID Installer: ${{ vars.APPLE_DEVELOPER_NAME }} (${{ vars.APPLE_TEAM_ID }})"
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          chmod +x scripts/build-macos-pkg.sh
          ./scripts/build-macos-pkg.sh ${{ matrix.arch }}

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Upload signed .pkg
        uses: actions/upload-artifact@v4
        with:
          name: pkg-darwin-${{ matrix.arch }}
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 1

  # macOS now ships ONLY as the signed package — there is no unsigned macOS
  # binary to fall back on — so a release waits for both packages. Publishing
  # without them would point the cask at files that do not exist.
  release:
    needs: [build, sign-macos]
    if: ${{ inputs.skip_release != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Download signed macOS packages (amd64)
        uses: actions/download-artifact@v4
        with:
          name: pkg-darwin-amd64
          path: dist/

      - name: Download signed macOS packages (arm64)
        uses: actions/download-artifact@v4
        with:
          name: pkg-darwin-arm64
          path: dist/

      - name: Create checksums
        run: |
          cd dist
          sha256sum clerk-protect-* > checksums.txt
          cat checksums.txt

      - name: Get release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # Check if release already exists with notes
          EXISTING_NOTES=$(gh release view "${VERSION}" --json body -q .body 2>/dev/null || echo "")
          if [ -n "$EXISTING_NOTES" ]; then
            echo "Release already has notes, preserving them"
            echo "$EXISTING_NOTES" > /tmp/release_notes.md
          elif [ "$(git cat-file -t "refs/tags/${VERSION}" 2>/dev/null)" = "tag" ]; then
            # An annotated tag: its annotation is the release notes.
            git tag -l --format='%(contents:body)' "${VERSION}" > /tmp/release_notes.md
          else
            # A lightweight tag has no annotation, and %(contents:body) would
            # hand back the tagged COMMIT's body instead — so no notes here, and
            # GitHub generates them below.
            : > /tmp/release_notes.md
          fi
          # A lightweight tag (plain `git tag v1.2.3`) has no annotation, so the
          # notes are empty; then GitHub generates them from the merged pull
          # requests instead of publishing a blank release.
          if [ -s /tmp/release_notes.md ] && grep -q '[^[:space:]]' /tmp/release_notes.md; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          body_path: /tmp/release_notes.md
          generate_release_notes: ${{ steps.release_notes.outputs.generate == 'true' }}
          files: |
            dist/clerk-protect-*
            dist/checksums.txt

      # The cask and formula are what `brew upgrade` reads. The script rewrites
      # the version AND every checksum, and fails rather than writing a partial
      # update: a cask whose version moved and whose checksum did not fails
      # every install.
      # main takes changes only through a pull request (an organization rule
      # for public repositories), so the update arrives as one — merge it and
      # `brew upgrade` finds the release. The v0.3.0 release pushed to main
      # directly, was refused, and needed the same update opened by hand.
      - name: Open a pull request pointing Homebrew at this release
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main

          branch="release/homebrew-${VERSION}"
          git checkout -b "$branch"
          python3 scripts/update-homebrew.py --version "$VERSION" --dist dist

          git add Casks/clerk-protect.rb Formula/clerk-protect.rb
          git commit -m "release: update Homebrew to ${VERSION}"
          git push origin "$branch"

          gh pr create --base main --head "$branch" \
            --title "release: update Homebrew to ${VERSION}" \
            --body "Points the Homebrew cask and formula at ${VERSION}: the version, and every checksum from the release's published \`checksums.txt\`, written by \`scripts/update-homebrew.py\`. Merge it and \`brew upgrade\` finds the release."
